# /etc/nginx/sites-enabled/ikigai-payroll — โครงใหม่
#
# Routing rules:
#   /payroll/*  → Express  (port 3000)
#   ทุก path อื่น → Next.js (port 3010) — รวม /login, /admin, /staff, /reserva, /persona
#
# วิธีใช้:
#   1. backup config เดิมก่อน
#   2. คัดลอกไฟล์นี้ทับ /etc/nginx/sites-enabled/ikigai-payroll
#   3. nginx -t && systemctl reload nginx

server {
    server_name ikigaimedihealth.com www.ikigaimedihealth.com;

    # ── Payroll Express (port 3000) ──
    location /payroll {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── ทุก path อื่น → Next.js (port 3010) ──
    # ครอบคลุม: /, /login, /admin, /staff, /reserva, /persona, /api, /_next/*
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 60s;
        client_max_body_size 5m;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ikigaimedihealth.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ikigaimedihealth.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.ikigaimedihealth.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = ikigaimedihealth.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name ikigaimedihealth.com www.ikigaimedihealth.com;
    return 404; # managed by Certbot
}
