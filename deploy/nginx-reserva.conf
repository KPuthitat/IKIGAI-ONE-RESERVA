# IKIGAI OS RESERVA — Nginx location block
#
# วิธีใช้:
#   1. สำเนาบรรทัด `location /reserva ...` ทั้งหมดข้างล่างนี้
#      ไปวางใน server block ของ ikigaimedihealth.com
#      (มักอยู่ที่ /etc/nginx/sites-available/ikigaimedihealth.com หรือ default)
#   2. วางก่อนหรือต่อจาก location block อื่น (ลำดับไม่สำคัญ)
#   3. sudo nginx -t && sudo systemctl reload nginx

# WebSocket / HMR (สำหรับ Next.js dev/turbopack — production ไม่จำเป็นแต่ใส่ไว้ก็ปลอดภัย)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# === วางสามบล็อกข้างล่างนี้ใน server { ... } ของ ikigaimedihealth.com ===

# 1) handle exact /reserva (ไม่มี trailing slash) — redirect ไป /reserva/
location = /reserva {
    return 301 /reserva/;
}

# 2) main proxy: /reserva/* → Next.js ที่พอร์ต 3010
location /reserva/ {
    proxy_pass http://127.0.0.1:3010/reserva/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 5m;
}

# 3) Next.js static assets (_next/static และ images) — cache ยาว
# Next.js ที่มี basePath จะเสิร์ฟ asset ภายใต้ /reserva/_next/* อยู่แล้ว
# ดังนั้น location /reserva/ ข้างบนครอบคลุมแล้ว ไม่ต้องเพิ่ม
